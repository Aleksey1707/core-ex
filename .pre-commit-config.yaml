# Хуки без явной стадии — только на commit: иначе pre-commit гоняет весь набор ещё раз на push.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-symlinks

  # Порядок как у `make` (Makefile default):
  #   boundary-check → rules-check → layout-check → spec-check → format-check → compile →
  #   compile-no-optional → consumer-check → deps-clean → xref → dialyzer → test → credo → audit
  - repo: local
    hooks:
      - id: boundary-lint
        name: "Boundary: библиотека не знает потребителя"
        entry: elixir scripts/boundary_lint.exs
        language: system
        require_serial: true
        pass_filenames: false

      - id: rules-lint
        name: "Rules: свод docs/rules"
        entry: elixir scripts/rules_lint.exs
        language: system
        require_serial: true
        pass_filenames: false

      - id: layout-lint
        name: "Layout: разделители внутри модуля"
        entry: elixir scripts/layout_lint.exs
        language: system
        require_serial: true
        pass_filenames: false

      - id: spec-lint
        name: "Spec: форма результата через Core.Result"
        entry: elixir scripts/spec_lint.exs
        language: system
        require_serial: true
        pass_filenames: false

      - id: mix-format
        name: "Elixir: mix format"
        entry: mix format --check-formatted
        language: system
        require_serial: true
        pass_filenames: false

      - id: mix-compile
        name: "Elixir: mix compile"
        entry: mix compile --warnings-as-errors
        language: system
        require_serial: true
        pass_filenames: false
        # Сборка и тесты — только когда в коммите код: правка одних docs/ их не меняет.
        files: &code |
          (?x)^(
            (lib|test|config|scripts|fixtures|priv|deploy)/.*|
            mix\.exs|mix\.lock|Makefile|\.credo\.exs|\.formatter\.exs|dialyzer\.ignore\.exs
          )$

      - id: mix-compile-no-optional
        name: "Elixir: mix compile --no-optional-deps"
        entry: mix compile --no-optional-deps --warnings-as-errors
        language: system
        require_serial: true
        pass_filenames: false
        files: *code

      - id: consumer-check
        name: "Consumer: предупреждения фикстуры-потребителя"
        entry: make consumer-check
        language: system
        require_serial: true
        pass_filenames: false
        files: *code

      - id: mix-deps-clean
        name: "Elixir: mix deps.clean --unused"
        entry: mix deps.clean --unused
        language: system
        require_serial: true
        pass_filenames: false
        files: *code

      - id: mix-xref
        name: "Elixir: mix xref (циклы)"
        entry: mix xref graph --format cycles --fail-above 1
        language: system
        require_serial: true
        pass_filenames: false
        files: *code

      - id: mix-dialyzer
        name: "Elixir: mix dialyzer"
        entry: mix dialyzer
        language: system
        require_serial: true
        pass_filenames: false
        files: *code

      - id: mix-test
        name: "Elixir: mix test"
        entry: make test
        language: system
        require_serial: true
        pass_filenames: false
        files: *code

      - id: mix-credo
        name: "Elixir: mix credo"
        entry: make credo
        language: system
        require_serial: true
        pass_filenames: false
        files: *code

      - id: mix-audit
        name: "Elixir: mix deps.audit + mix hex.audit"
        entry: make audit
        language: system
        require_serial: true
        pass_filenames: false

      # Только на push: тег `vX.Y.Z` уезжает вместе с коммитом, и версия в нём должна быть
      # сведена. На коммитах ветки проверять нечего — там штатное «Не выпущено».
      - id: release-lint
        name: "Release: версия сведена с тегом"
        entry: elixir scripts/release_lint.exs
        language: system
        require_serial: true
        pass_filenames: false
        always_run: true
        stages: [pre-push]
